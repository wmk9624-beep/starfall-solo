<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c1821"><title>墜星前哨｜岩谷重建 Alpha</title><link rel="stylesheet" href="style.css"></head><body><main id="app" aria-live="off" style="color:#edf3f2;background:#0c1821;padding:0;min-height:100vh"><section id="startup" style="max-width:36rem;margin:0 auto;padding:32px 20px;font-family:system-ui,-apple-system,sans-serif;line-height:1.7"><p style="color:#8ed6bf;letter-spacing:.1em">STARFALL / ALPHA 03</p><h1 style="font-size:1.65rem">墜星前哨：岩谷重建</h1><p>正在啟動遊戲……</p><p id="boot-status" role="status">如果一直停留在此畫面，代表遊戲腳本尚未成功執行。手機檔案預覽可能不允許執行 JavaScript；請使用正式網站網址在 Safari 或 Chrome 開啟。</p><p>這是離線試玩檔，不是已部署的網站。未成功啟動不會刪除原存檔。</p><noscript><p>目前未啟用 JavaScript，無法開始遊戲。</p></noscript></section></main><script>(function(){var app=document.getElementById('app');function failed(message){if(app.getAttribute('data-ready')==='true')return;var status=document.getElementById('boot-status');if(!status){app.textContent='';var section=document.createElement('section');section.style.cssText='max-width:36rem;margin:auto;padding:32px 20px;line-height:1.7';var h=document.createElement('h1');h.textContent='墜星前哨：啟動失敗';section.appendChild(h);status=document.createElement('p');status.id='boot-status';section.appendChild(status);app.appendChild(section);}status.textContent='遊戲未能啟動：'+message+'。請使用支援 JavaScript 的正式瀏覽器開啟，或將此提示傳回以便排查。';}window.addEventListener('error',function(e){failed(e.message||'載入遊戲程式失敗');},true);window.addEventListener('unhandledrejection',function(e){failed(String(e.reason||'啟動異常'));});setTimeout(function(){if(app.getAttribute('data-ready')!=='true'&&document.getElementById('boot-status')){var status=document.getElementById('boot-status');if(status.textContent.indexOf('遊戲未能啟動：')!==0)failed('遊戲腳本沒有完成啟動');}},4000);})();</script><script src="core.js"></script><script src="ui.js"></script></body></html>
